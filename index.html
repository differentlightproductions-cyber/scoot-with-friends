<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e4d7" />
    <link rel="icon" href="/favicon.svg" />
    <title>Scoot with Friends</title>
    <style>
      /* Loading card, inline so it is styled before any script runs (same kit as src/ui/theme.css). */
      @font-face { font-family: Bungee; src: url("/fonts/Bungee-Regular.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: Marker; src: url("/fonts/PermanentMarker-Regular.woff2") format("woff2"); font-display: swap; }
      #destination-loading { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 24px; color: #f4f1e8; font-family: system-ui, sans-serif;
        background: radial-gradient(circle at 20% 30%, #ffffff0d 0 1px, transparent 1.4px) 0 0 / 7px 7px, radial-gradient(circle at 70% 60%, #00000055 0 1px, transparent 1.6px) 0 0 / 5px 5px, linear-gradient(160deg, #202327, #15171a 60%, #111315); }
      #destination-loading .ld-card { display: grid; gap: 14px; width: min(86vw, 460px); transform: rotate(-1.5deg); }
      #destination-loading .ld-tag { justify-self: start; padding: 6px 10px 4px; font: 12px/1 Bungee, Impact, sans-serif; letter-spacing: .08em; color: #0b0c0d; background: #c6ff00; border-radius: 4px; transform: rotate(-2deg); box-shadow: 3px 3px 0 #0b0c0d; }
      #destination-loading strong { font: clamp(28px, 6vw, 46px)/1.02 Bungee, Impact, sans-serif; text-transform: uppercase; text-wrap: balance; text-shadow: 3px 3px 0 #ff5a1f, 6px 6px 0 #0b0c0d; }
      #destination-loading progress { appearance: none; -webkit-appearance: none; width: 100%; height: 22px; border: 3px solid #0b0c0d; border-radius: 12px; background: #f4f1e8; box-shadow: 5px 5px 0 #ff5a1f; overflow: hidden; }
      #destination-loading progress::-webkit-progress-bar { background: #f4f1e8; }
      #destination-loading progress::-webkit-progress-value { background: repeating-linear-gradient(-45deg, #c6ff00 0 12px, #a8e000 12px 24px); border-right: 3px solid #0b0c0d; transition: width .35s; }
      #destination-loading progress::-moz-progress-bar { background: repeating-linear-gradient(-45deg, #c6ff00 0 12px, #a8e000 12px 24px); }
      #destination-loading small { font: 700 13px/1.3 system-ui, sans-serif; color: #cfd4d8; letter-spacing: .02em; }
      #destination-loading .ld-tip { font: 17px/1.3 Marker, "Comic Sans MS", cursive; font-style: normal; color: #ffd23f; min-height: 1.3em; }
      #destination-loading[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="destination-loading" role="status" aria-live="polite"><div class="ld-card"><span class="ld-tag">SCOOT WITH FRIENDS</span><strong>Getting ready</strong><progress max="100" value="5"></progress><small>Loading the game…</small><em class="ld-tip"></em></div></div><div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
